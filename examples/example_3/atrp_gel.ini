# Living (ATRP) copolymerization of a monomer and a divinyl cross-linker in bulk, as in
# Polanowski, Jeszka & Matyjaszewski, Polymer 2010, 51, 6084: [I]0 : [X]0 : [M]0 = 1 : 2 : 100 on
# 32^3 FCC cells (131,072 sites, all reactive units; no solvent).

[system]
cells = 32
n_units = 131072
monovinyl_fraction = 0.980583   # (1 + 100) / 103: initiators and monomers
radical_fraction = 0.009709     # 1 / 103: initiators, all active from the start (ATRP)

[scheme]
mechanism = atrp
k_p1 = 0.02                     # monomer and cross-linker vinyls
k_p2 = 0.02                     # pendant vinyls, equally reactive
reaction_partner = random_neighbor

[run]
seed = 0                        # 0 = fresh entropy seed (written to run_config.ini)
stop_conversion = 0.9
snapshot_start = 0.05
snapshot_step = 0.05
log_every = 5000

[output]
directory = dll_atrp_gel
write_pdb = false              # the PSF files hold the network topology
write_psf = true
