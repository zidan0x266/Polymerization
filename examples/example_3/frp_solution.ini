# Free radical copolymerization of a monomer and a divinyl cross-linker in solution: half of the
# 55,296 sites of 24^3 FCC cells hold reactive units (1 % initiator, 4 % cross-linker), the other
# half solvent. Initiators decompose slowly, so radicals are made throughout the run.

[system]
cells = 24
n_units = 27648
monovinyl_fraction = 0.96
radical_fraction = 0.01

[scheme]
mechanism = frp
k_init = 0.00002                # initiator decomposition per time step
k_p1 = 0.05
k_p2 = 0.025
k_term = 0.5
reaction_partner = random_neighbor

[run]
seed = 0                        # 0 = fresh entropy seed (written to run_config.ini)
stop_conversion = 0.9
snapshot_start = 0.05
snapshot_step = 0.05
log_every = 20000

[output]
directory = dll_frp_solution
write_pdb = false               # the PSF files hold the network topology
