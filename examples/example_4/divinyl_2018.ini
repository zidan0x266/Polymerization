# ATRP homopolymerization of a divinyl monomer, the statistical model ("w.c. model") of Lyu et al.,
# Macromolecules 2018, 51, 6673: [X]0/[I]0 = 100/1, equal reactivity per vinyl group
# (k_px = 2 k_p2), 200,000 units. Without cyclization (cyclization = false) it is the "wo.c."
# model. For [X]0/[I]0 = 100/10 run with
#   monovinyl_fraction=0.090909 radical_fraction=0.090909 snapshot_start=0.2 stop_conversion=0.4
# The gel point, the maximum of the reduced degree of polymerization over the PSF snapshots, lies
# at a vinyl conversion of about 0.07 (100/1) and 0.24 (100/10).

[system]
n_units = 200000
monovinyl_fraction = 0.009901   # initiators only (1/101): no monovinyl monomer
radical_fraction = 0.009901

[scheme]
mechanism = atrp
k_px = 2.0                      # an unreacted divinyl monomer (two vinyl groups)
k_p2 = 1.0                      # a pendant vinyl
k_p1 = 1.0                      # a monovinyl monomer (none here)
cyclization = true

[run]
seed = 0                        # 0 = fresh entropy seed (written to run_config.ini)
stop_conversion = 0.15
snapshot_start = 0.02
snapshot_step = 0.005
log_every = 100000

[output]
directory = stat_divinyl_2018   # about 0.5 GB of PSF snapshots
