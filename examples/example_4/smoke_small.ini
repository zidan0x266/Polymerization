# Small system that runs in a fraction of a second: 20,000 units. The smoke tests run it as ATRP and
# as FRP.

[system]
n_units = 20000
monovinyl_fraction = 0.9
radical_fraction = 0.01

[scheme]
mechanism = atrp
k_init = 0.001
k_p1 = 1.0
k_px = 2.0
k_p2 = 1.0
k_term = 10

[run]
stop_conversion = 0.5
snapshot_start = 0.1
snapshot_step = 0.1

[output]
directory = smoke_stat
