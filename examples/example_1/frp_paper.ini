# FRP network with 4 % cross-linker (Zhang et al., Macromolecules 2025, Table 1).

[system]
lattice = 100 100 100
n_units = 106250
monovinyl_fraction = 0.96
radical_fraction = 0.002    # 212 dormant initiators

[scheme]
mechanism = frp
k_init = 0.00001
k_p1 = 0.50
k_p2 = 0.25
k_term = 0.95
competition_rule = legacy   # published behavior; see README, Model notes
initiation_requires_neighbor = true   # published behavior; see README, Model notes

[run]
samples = 5
seed = 0
mcs_initial_relaxation = 1000
mcs_equilibration = 1000
stop_conversion = 0.96
snapshot_start = 0.03
snapshot_step = 0.01
log_every_mcs = 1000

[output]
directory = frp_X04
write_pdb = true
write_psf = true
write_restart = true
