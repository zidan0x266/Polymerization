# ATRP network with 4 % cross-linker (Zhang et al., Macromolecules 2025, Table 1).

[system]
lattice = 100 100 100
n_units = 106250            # number density 0.85 (8 sites per unit)
monovinyl_fraction = 0.96   # [X] = 1 - 0.96 = 4 % cross-linker
radical_fraction = 0.002    # 212 living chains, all present from t = 0

[scheme]
mechanism = atrp
k_p1 = 0.0050               # propagation onto a monomer / first vinyl of a cross-linker
k_p2 = 0.0025               # propagation onto a pendant vinyl (= k_p1 / 2)
# no initiation, no termination: activation/deactivation treated implicitly

[run]
samples = 5
seed = 0                    # 0 = fresh entropy seed (written to run_config.ini)
mcs_initial_relaxation = 1000
mcs_equilibration = 10000
stop_conversion = 0.96
snapshot_start = 0.03
snapshot_step = 0.01
log_every_mcs = 1000

[output]
directory = atrp_X04
write_pdb = true
write_psf = true
write_restart = true
