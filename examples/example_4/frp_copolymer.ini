# Free radical copolymerization of a monomer and 4 % divinyl cross-linker with 0.2 % initiator, the
# composition and propagation/termination ratios of the 3dbfm FRP example (Zhang et al.,
# Macromolecules 2025), in the statistical model: 106,250 units, all reacting with all.

[system]
n_units = 106250
monovinyl_fraction = 0.96
radical_fraction = 0.002

[scheme]
mechanism = frp
k_init = 0.0001                 # initiator decomposition per unit time
k_p1 = 0.5                      # rate coefficients per pair of units, in units of 1/N per unit time
k_p2 = 0.25
k_term = 0.95
cyclization = true

[run]
seed = 0
stop_conversion = 0.96
snapshot_start = 0.05
snapshot_step = 0.05
log_every = 100000

[output]
directory = stat_frp_copolymer
