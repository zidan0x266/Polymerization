# ATRP homopolymerization of a divinyl monomer in bulk, as in the DLL simulations of Lyu et al.,
# Macromolecules 2018, 51, 6673 (Table 2): [X]0/[I]0 = 100/1 on 32^3 FCC cells (131,072 sites,
# all occupied, no solvent). For [X]0/[I]0 = 100/10 run with
#   monovinyl_fraction=0.090909 radical_fraction=0.090909 stop_conversion=0.75
# The gel point, the maximum of the reduced degree of polymerization over the PSF snapshots, lies
# at a vinyl conversion of about 0.13 (100/1) and 0.33 (100/10).

[system]
cells = 32
n_units = 131072
monovinyl_fraction = 0.009901   # initiators only (1/101): no monovinyl monomer
radical_fraction = 0.009901

[scheme]
mechanism = atrp
k_p1 = 0.02                     # an unreacted divinyl monomer (two vinyl groups)
k_p2 = 0.01                     # a pendant vinyl: equal reactivity per vinyl group
reaction_partner = all_neighbors
cyclization = true

[run]
seed = 0                        # 0 = fresh entropy seed (written to run_config.ini)
stop_conversion = 0.4
snapshot_start = 0.02
snapshot_step = 0.01
log_every = 500

[output]
directory = dll_divinyl_2018
write_pdb = false               # the PSF files hold the network topology (about 0.4 GB in all)
