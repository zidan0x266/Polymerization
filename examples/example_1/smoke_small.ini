# Small 32^3 system for quick checks; change the mechanism on the command line, e.g.
#   bfm_react examples/example_1/smoke_small.ini mechanism=frp k_init=0.01 k_p1=0.5 k_p2=0.25 k_term=0.95

[system]
lattice = 32 32 32
n_units = 3481
monovinyl_fraction = 0.96
radical_fraction = 0.002    # 6 initiator-derived units

[scheme]
mechanism = atrp
k_p1 = 0.005
k_p2 = 0.0025

[run]
samples = 1
seed = 1
mcs_initial_relaxation = 100
mcs_equilibration = 100
stop_conversion = 0.96
snapshot_start = 0.05
snapshot_step = 0.05
log_every_mcs = 500

[output]
directory = smoke
write_pdb = false
write_psf = false
