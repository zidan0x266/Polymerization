# Chains of 16 beads in solvent at polymer fraction 0.5: 512 chains on 16^3 FCC cells (16,384 sites).

[system]
cells = 16
n_units = 0              # no reactive units: chains and solvent only
chain_length = 16
n_chains = 512
initial = random_walk

[run]
seed = 0                # 0 = fresh entropy seed (written to run_config.ini)
steps = 100000
log_every = 10000

[output]
directory = dll_solution
