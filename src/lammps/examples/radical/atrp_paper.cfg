# Atom transfer radical polymerization (ATRP)
# of monovinyl monomers and divinyl cross-linkers, with the chemistry of the 3DBFM module.
# Bead types: MON monomer, THR cross-linker, PRI initiator fragment with its radical, ONE
# monovinyl radical, TWO saturated unit, FOU/FIV/SIX/SEV/EIG partially or fully reacted
# cross-linker, INI dormant initiator. Rates are probabilities per check:
# k_init=0 k_p1=0.005 k_px=0.005 k_p2=0.0025 k_term=0

[general]
interval = 20
competition = legacy

[group_radical]
bond_type = 1
angle_type = 1

[reaction_primary_radical+monomer]
reaction = PRI + MON -> TWO:ONE
rate = 0.005
cutoff = 1.2
intramolecular = true
intraresidual = true
group = radical

[reaction_chain_radical+monomer]
reaction = ONE + MON -> TWO:ONE
rate = 0.005
cutoff = 1.2
intramolecular = true
intraresidual = true
group = radical

[reaction_crosslinker_radical(4)+monomer]
reaction = FOU + MON -> FIV:ONE
rate = 0.005
cutoff = 1.2
intramolecular = true
intraresidual = true
group = radical

