# Precursors of the end-linked network with No = 20 (Zhang et al., Macromolecules 2026, Table 1):
# 5680 chains of 18 beads, reactive at both ends, and 2840 tetrafunctional cross-linkers.

[system]
chain_length = 18
n_chains = 5680
n_crosslinkers = 2840       # half the number of chains: four sites per cross-linker, two ends per chain
occupancy = 0.05            # 80^3 cells, box edge 113.14, number density 0.073
bond_length = 1.0
mass = 1.0

[walk]
bond_angles = 60, 90, 120
site_weighting = legacy

[run]
seed = 0                    # 0 = fresh entropy seed (written to run_config.ini)

[output]
directory = endlink_No20
data_file = config.lmp
write_xyz = true
