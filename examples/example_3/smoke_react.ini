# Small reactive system that runs in a fraction of a second: 864 sites (6^3 FCC cells) holding
# 700 units and solvent. The smoke tests run it as ATRP and FRP.

[system]
cells = 6
n_units = 700
monovinyl_fraction = 0.9
radical_fraction = 0.03

[scheme]
mechanism = atrp
k_init = 0.02
k_p1 = 0.5
k_p2 = 0.25
k_term = 0.9

[run]
stop_conversion = 0.5
snapshot_start = 0.1
snapshot_step = 0.1
log_every = 500

[output]
directory = smoke_dll_react
